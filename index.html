<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortest Path — Dijkstra</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Shortest Path</h1>
    <h2>Dijkstra · <span id="nodeCount">2 nodes</span></h2>
  </header>
  <main id="nodeCards" aria-label="Node editor"></main>
  <section id="graphPanel" aria-label="Graph">
    <div id="graph"></div>
    <aside id="levelMovePanel" hidden>
      <h3 id="selectedNodeName"></h3><span id="selectedNodeLevel"></span>
      <button type="button" id="moveLeftButton">← Left</button>
      <button type="button" id="moveRightButton">Right →</button>
    </aside>
    <aside id="solutionCard" hidden><h3 id="solutionValue"></h3><p id="solutionPath"></p></aside>
    <aside id="animPanel" hidden>
      <h3 id="animStep"></h3><p id="animText"></p>
      <p class="legend"><span class="fwd">Forward search</span><span class="bwd">Backward search</span><span class="meet">Meeting point</span></p>
      <p><small>→ distance from start · ← distance to destination</small></p>
      <button type="button" id="skipButton">Skip animation ⏭</button>
    </aside>
  </section>
  <button type="button" id="solveButton"><span id="solveLabel">SOLVE</span> ↗</button>
  <div id="toast" role="status" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
