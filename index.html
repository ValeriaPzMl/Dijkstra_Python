<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f0">
  <title>Shortest Path — Dijkstra Studio</title>
  <style>
    :root {
      color-scheme: light;
      /* Swiss system: hard contrast, measured spacing, one catalytic accent. */
      --paper: #f4f4f0;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #6f6f69;
      --line: #d6d6cf;
      --line-strong: #9a9a92;
      --accent: #e3342b;
      --accent-dark: #b92019;
      --green: #267454;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --target-minimum: 48px;
      --shadow: 0 12px 30px rgb(17 17 17 / 12%);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, Helvetica, Arial, sans-serif;
      --transition-fast: 140ms ease;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible,
    .graph-node:focus-visible { outline: 3px solid rgb(227 52 43 / 35%); outline-offset: 3px; }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .app-shell {
      width: 100%; min-width: 0;
      height: 100dvh;
      min-height: 650px;
      display: grid;
      grid-template-rows: minmax(330px, 38%) minmax(0, 1fr);
    }
    .editor-panel {
      min-width: 0; width: 100%; min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 24px 12px;
      border-bottom: 2px solid var(--ink);
      background: var(--paper);
      z-index: 2;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 42px;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: #fff; background: var(--ink); border-bottom: 4px solid var(--accent);
      font: 800 17px/1 var(--mono);
    }
    .brand-copy { min-width: 0; }
    .eyebrow { margin: 0 0 4px; font: 700 9px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(17px, 1.6vw, 22px); line-height: 1.1; letter-spacing: -.045em; font-weight: 800; }
    .masthead-note { margin: 0; text-align: right; color: var(--muted); font: 10px/1.55 var(--mono); letter-spacing: .04em; }
    .editor-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .section-title { margin: 0; font: 800 10px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .node-count { color: var(--muted); font: 10px/1.2 var(--mono); white-space: nowrap; }

    .node-scroller {
      min-width: 0; width: 100%; max-width: 100%; min-height: 0; flex: 1; overflow-x: auto; overflow-y: hidden;
      display: flex; align-items: stretch; gap: 12px;
      padding: 1px 2px 8px 1px;
      scrollbar-width: thin; scrollbar-color: #999991 transparent;
      scroll-behavior: smooth;
    }
    .node-scroller::-webkit-scrollbar { height: 8px; }
    .node-scroller::-webkit-scrollbar-track { background: transparent; }
    .node-scroller::-webkit-scrollbar-thumb { background: #999991; border: 2px solid var(--paper); }

    .node-card {
      position: relative; flex: 0 0 360px; width: 360px; min-width: 0;
      border: 1px solid var(--line-strong); border-top: 4px solid var(--ink);
      background: var(--surface); padding: 11px 12px 12px; min-height: 0;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .node-card.is-start { border-top-color: var(--green); }
    .node-card.is-finish { border-top-color: var(--accent); }
    .node-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 32px; }
    .node-card-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .node-index { font: 800 10px/1 var(--mono); color: var(--muted); }
    .node-name-heading { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 800; }
    .node-level-badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); font: 700 8px/1 var(--mono); letter-spacing: .05em; white-space: nowrap; }
    .icon-button { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--line); background: white; color: var(--muted); font: 22px/1 var(--sans); padding: 0; transition: color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast); }
    .icon-button:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.04); }
    .field-row { display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label, .mini-label { font: 800 8px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .edge-form select, .edge-form input {
      width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 0;
      background: #fff; color: var(--ink); padding: 0 9px; min-width: 0; font-size: 12px;
    }
    .field input:focus, .field select:focus, .edge-form input:focus, .edge-form select:focus { border-color: var(--ink); outline: none; }
    .connections { min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; }
    .connections-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 13px; }
    .connection-list { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; max-height: 54px; overflow-y: auto; align-content: flex-start; padding: 1px 1px 2px 0; }
    .connection-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; max-width: 100%; padding: 2px 5px 2px 7px; border: 1px solid var(--line); background: #f7f7f3; font: 10px/1.2 var(--mono); }
    .connection-chip strong { font-weight: 800; }
    .connection-chip button { border: 0; background: transparent; color: var(--muted); padding: 0 2px; min-width: 20px; min-height: 20px; font-size: 15px; line-height: 1; }
    .connection-chip button:hover { color: var(--accent); }
    .empty-edges { align-self: flex-start; color: #92928a; font: 9px/1.4 var(--mono); padding-top: 5px; }
    .edge-form { display: grid; grid-template-columns: minmax(0, 1fr) 76px 38px; gap: 7px; margin-top: auto; align-items: end; }
    .edge-form select, .edge-form input { height: 38px; font-size: 11px; padding: 0 7px; }
    .edge-add { height: 38px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-size: 21px; line-height: 1; padding: 0; transition: background var(--transition-fast), transform var(--transition-fast); }
    .edge-add:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

    .editor-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 1px; }
    .add-node-button { width: 76px; height: 76px; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font: 42px/1 var(--sans); padding: 0; transition: background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast), border-color var(--transition-fast); }
    .add-node-button:hover { border-color: var(--accent); background: var(--accent); color: #fff; transform: translateY(-2px); }
    .solve-button { min-width: 184px; height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 0 19px; border: 2px solid var(--accent); background: var(--accent); color: #fff; font: 900 15px/1 var(--mono); letter-spacing: .12em; transition: background var(--transition-fast), transform var(--transition-fast), border-color var(--transition-fast); }
    .solve-button:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-2px); }
    .solve-arrow { font-size: 24px; line-height: 1; }

    .graph-panel { min-width: 0; width: 100%; min-height: 0; position: relative; overflow: hidden; background: var(--surface); }
    .graph-canvas { position: absolute; z-index: 0; inset: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #b8b8b0 transparent; }
    .graph-canvas::-webkit-scrollbar { width: 8px; height: 8px; }
    .graph-canvas::-webkit-scrollbar-thumb { background: #b8b8b0; }
    #graphSvg { display: block; background: var(--surface); }
    .graph-topline { position: absolute; z-index: 2; top: 15px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; gap: 16px; }
    .graph-label { padding: 7px 9px; background: #fff; border: 1px solid var(--ink); border-left: 4px solid var(--accent); font: 800 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .graph-legend { display: flex; gap: 13px; align-items: center; color: var(--muted); background: #fff; padding: 7px 9px; border: 1px solid var(--line-strong); font: 9px/1 var(--mono); }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); }
    .legend-dot.finish { background: var(--accent); }
    .edge-path { fill: none; stroke: #92928b; stroke-width: 1.7; vector-effect: non-scaling-stroke; marker-end: url(#arrow); }
    .edge-path.is-solution { stroke: var(--accent); stroke-width: 3.2; marker-end: url(#arrow-solution); }
    .edge-label-bg { fill: #fff; stroke: #d1d1ca; stroke-width: 1; }
    .edge-label { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font: 800 13px var(--mono); }
    .graph-node { cursor: pointer; outline: none; }
    .graph-node.start, .graph-node.finish { cursor: not-allowed; }
    .graph-node-rect { fill: #fff; stroke: var(--ink); stroke-width: 1.8; vector-effect: non-scaling-stroke; }
    .graph-node.start .graph-node-rect { stroke: var(--green); stroke-width: 3; }
    .graph-node.finish .graph-node-rect { stroke: var(--accent); stroke-width: 3; }
    .graph-node.solution .graph-node-rect { fill: #fff0ee; stroke: var(--accent); stroke-width: 3.5; }
    .graph-node.selected .graph-node-rect { stroke: var(--accent); stroke-width: 4; stroke-dasharray: 5 3; }
    .graph-node-text { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font: 900 15px var(--mono); }
    .graph-node-role { font: 800 9px var(--mono); fill: var(--muted); text-anchor: middle; letter-spacing: .08em; }
    .level-header { fill: #77776f; text-anchor: middle; font: 800 10px var(--mono); letter-spacing: .1em; }
    .level-divider { stroke: #e7e7e1; stroke-width: 1; stroke-dasharray: 3 7; }

    .level-move-panel { position: absolute; z-index: 4; top: 58px; right: 24px; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 48px); padding: 10px 12px; border: 1px solid var(--ink); border-left: 4px solid var(--accent); background: #fff; box-shadow: var(--shadow); }
    .level-move-panel[hidden] { display: none; }
    .selected-node-copy { display: flex; flex-direction: column; gap: 4px; min-width: 85px; }
    .selected-node-label { margin: 0; color: var(--muted); font: 800 8px/1.2 var(--mono); letter-spacing: .12em; }
    .selected-node-name { font-size: 13px; font-weight: 900; }
    .selected-node-level { color: var(--muted); font: 9px/1.2 var(--mono); }
    .level-move-actions { display: flex; gap: 6px; }
    .level-button { min-height: var(--target-minimum); padding: 0 12px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: 800 9px/1 var(--mono); letter-spacing: .05em; transition: color var(--transition-fast), background var(--transition-fast), transform var(--transition-fast); }
    .level-button:hover:not(:disabled) { background: var(--ink); color: #fff; transform: translateY(-1px); }
    .level-button--right { border-color: var(--accent); background: var(--accent); color: #fff; }
    .level-button--right:hover:not(:disabled) { background: var(--accent-dark); }

    .solution-card { position: absolute; z-index: 3; left: 24px; top: 96px; width: min(330px, calc(100% - 48px)); padding: 13px 14px; border: 1px solid var(--ink); border-left: 4px solid var(--accent); background: rgb(255 255 255 / 97%); box-shadow: var(--shadow); }
    .solution-card[hidden] { display: none; }
    .solution-label { margin: 0 0 7px; font: 800 9px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
    .solution-value { margin: 0; font-size: 19px; line-height: 1.1; font-weight: 900; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .solution-path { margin: 8px 0 0; color: var(--muted); font: 10px/1.6 var(--mono); overflow-wrap: anywhere; }
    .solution-path strong { color: var(--ink); }
    .graph-footer { position: absolute; left: 24px; bottom: 18px; z-index: 2; font: 9px/1.4 var(--mono); color: var(--muted); background: rgb(255 255 255 / 94%); padding: 6px 8px; border: 1px solid var(--line); }
    .toast { position: fixed; z-index: 20; bottom: 18px; right: 24px; max-width: min(420px, calc(100vw - 48px)); padding: 12px 15px; border: 1px solid var(--ink); background: var(--ink); color: #fff; box-shadow: var(--shadow); font: 11px/1.5 var(--mono); }
    .toast[hidden] { display: none; }
    .toast.error { background: var(--accent-dark); border-color: var(--accent-dark); }

    @media (min-width: 1500px) {
      .editor-panel { padding-left: 32px; padding-right: 32px; }
      .node-card { flex-basis: 380px; width: 380px; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-shell { min-height: 780px; height: max(100dvh, 780px); grid-template-rows: minmax(320px, 42%) minmax(390px, 1fr); }
      .editor-panel { padding: 12px 12px 9px; }
      .masthead { margin-bottom: 10px; }
      .masthead-note { display: none; }
      .node-card { flex-basis: 328px; width: 328px; }
      .editor-actions { gap: 8px; }
      .add-node-button { width: 64px; height: 64px; }
      .solve-button { min-width: 154px; height: 64px; padding: 0 14px; font-size: 13px; }
      .graph-topline { top: 10px; left: 12px; right: 12px; }
      .graph-legend { gap: 8px; font-size: 8px; padding: 6px; }
      .graph-label { padding: 6px; }
      .graph-node-text { font-size: 11px; }
      .graph-node-role { font-size: 7px; letter-spacing: .04em; }
      .level-move-panel { top: 56px; right: 12px; left: 12px; max-width: none; justify-content: space-between; gap: 8px; padding: 8px; }
      .level-button { padding: 0 8px; min-height: 42px; font-size: 8px; }
      .selected-node-copy { min-width: 66px; }
      .solution-card { left: 12px; top: 112px; width: min(300px, calc(100% - 24px)); }
      .graph-footer { left: 12px; bottom: 12px; max-width: calc(100% - 24px); }
      .toast { bottom: 12px; right: 12px; max-width: calc(100vw - 24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="editor-panel" aria-labelledby="pageTitle">
      <header class="masthead">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">D.</div>
          <div class="brand-copy">
            <p class="eyebrow">Graph Lab / 001</p>
            <h1 id="pageTitle">Shortest Path <span style="font-weight:400;color:#77776f">— Dijkstra</span></h1>
          </div>
        </div>
        <p class="masthead-note">DIRECTED WEIGHTED GRAPH<br>NON-NEGATIVE WEIGHTS</p>
      </header>
      <div class="editor-meta">
        <h2 class="section-title">01 / Define nodes &amp; connections</h2>
        <span class="node-count" id="nodeCount">02 NODES</span>
      </div>
      <div class="node-scroller" id="nodeCards" aria-label="Node editor" aria-live="polite"></div>
    </section>

    <section class="graph-panel" aria-label="Graph visualization">
      <div class="graph-topline">
        <div class="graph-label">02 / Graph preview</div>
        <div class="graph-legend" aria-label="Legend">
          <span class="legend-item"><i class="legend-dot" aria-hidden="true"></i>START</span>
          <span class="legend-item"><i class="legend-dot finish" aria-hidden="true"></i>DESTINATION</span>
        </div>
      </div>
      <div class="graph-canvas" id="graphCanvas">
        <svg id="graphSvg" role="img" aria-label="Preview of the configured weighted graph" preserveAspectRatio="xMidYMid meet">
          <desc>Connections and weights appear here as they are configured above. The algorithm runs only when Solve is pressed.</desc>
        </svg>
      </div>
      <div class="level-move-panel" id="levelMovePanel" hidden aria-live="polite">
        <div class="selected-node-copy">
          <p class="selected-node-label">SELECTED NODE</p>
          <strong class="selected-node-name" id="selectedNodeName">—</strong>
          <span class="selected-node-level" id="selectedNodeLevel">LEVEL 1</span>
        </div>
        <div class="level-move-actions">
          <button type="button" class="level-button" id="moveLeftButton">← MOVE LEFT</button>
          <button type="button" class="level-button level-button--right" id="moveRightButton">MOVE RIGHT →</button>
        </div>
      </div>
      <aside class="solution-card" id="solutionCard" aria-live="polite" hidden>
        <p class="solution-label">03 / Dijkstra result</p>
        <p class="solution-value" id="solutionValue"></p>
        <p class="solution-path" id="solutionPath"></p>
      </aside>
      <div class="graph-footer">VISUAL LEVELS ONLY · SOLVE TO CALCULATE THE SHORTEST PATH</div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      'use strict';

      const nodeCards = document.getElementById('nodeCards');
      const nodeCount = document.getElementById('nodeCount');
      const graphCanvas = document.getElementById('graphCanvas');
      const graphSvg = document.getElementById('graphSvg');
      const levelMovePanel = document.getElementById('levelMovePanel');
      const selectedNodeName = document.getElementById('selectedNodeName');
      const selectedNodeLevel = document.getElementById('selectedNodeLevel');
      const moveLeftButton = document.getElementById('moveLeftButton');
      const moveRightButton = document.getElementById('moveRightButton');
      const solutionCard = document.getElementById('solutionCard');
      const solutionValue = document.getElementById('solutionValue');
      const solutionPath = document.getElementById('solutionPath');
      const toast = document.getElementById('toast');
      let appState = { nodes: [], max_level: 2, solution: null };
      let selectedNodeId = null;
      let busyAction = '';
      let toastTimer = null;

      const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
      const getNode = id => appState.nodes.find(node => node.id === id);
      const nodeName = id => getNode(id)?.name?.trim() || 'UNNAMED NODE';

      function showToast(message, isError = true) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.toggle('error', isError);
        toast.hidden = false;
        toastTimer = window.setTimeout(() => { toast.hidden = true; }, 4200);
      }

      async function api(url, options = {}) {
        try {
          const response = await fetch(url, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            cache: 'no-store',
            credentials: 'same-origin'
          });
          const payload = await response.json();
          if (payload.state) {
            appState = payload.state;
            if (!getNode(selectedNodeId) || ['start', 'finish'].includes(getNode(selectedNodeId)?.role)) {
              selectedNodeId = null;
            }
            renderAll();
          }
          if (!response.ok) {
            showToast(payload.error || 'The request could not be completed.');
            return null;
          }
          return payload;
        } catch (error) {
          showToast('Could not reach the Flask server. Check the connection and retry.');
          return null;
        }
      }

      async function loadState() {
        const payload = await api('/api/state');
        if (payload) {
          appState = payload.state;
          renderAll();
        }
      }

      function renderCards() {
        nodeCount.textContent = `${String(appState.nodes.length).padStart(2, '0')} NODES`;
        const cards = appState.nodes.map((node, index) => {
          const cardClass = node.role === 'start' ? ' is-start' : node.role === 'finish' ? ' is-finish' : '';
          const level = node.role === 'start' ? 'LEVEL 0 · FIXED' : node.role === 'finish' ? 'LAST LEVEL · FIXED' : `LEVEL ${node.level ?? 1}`;
          const outgoing = node.edges.map(edge => `
            <span class="connection-chip">
              <span>${escapeHTML(nodeName(edge.to))}</span>
              <strong>${escapeHTML(edge.weight)}</strong>
              <button type="button" aria-label="Remove connection to ${escapeHTML(nodeName(edge.to))}" title="Remove connection" data-action="remove-edge" data-node-id="${escapeHTML(node.id)}" data-target-id="${escapeHTML(edge.to)}">×</button>
            </span>`).join('');
          const targetOptions = appState.nodes.filter(other => other.id !== node.id).map(other =>
            `<option value="${escapeHTML(other.id)}">${escapeHTML(other.name.trim() || '— unnamed node —')}</option>`
          ).join('');
          const removeButton = appState.nodes.length > 2
            ? `<button type="button" class="icon-button" aria-label="Delete node ${escapeHTML(node.name)}" title="Delete node" data-action="delete-node" data-node-id="${escapeHTML(node.id)}">×</button>`
            : '<span aria-hidden="true" style="width:34px;height:34px"></span>';
          const roleField = node.role
            ? `<select id="role-${escapeHTML(node.id)}" disabled aria-label="Fixed node role"><option selected>${node.role === 'start' ? 'Start · fixed left' : 'Destination · fixed right'}</option></select>`
            : `<select id="role-${escapeHTML(node.id)}" data-action="update-role" data-node-id="${escapeHTML(node.id)}">
                 <option value="" selected>Regular</option>
                 <option value="start">Start</option>
                 <option value="finish">Destination</option>
               </select>`;

          return `
            <article class="node-card${cardClass}" data-card-id="${escapeHTML(node.id)}">
              <div class="node-card-head">
                <div class="node-card-title">
                  <span class="node-index">${String(index + 1).padStart(2, '0')}</span>
                  <span class="node-name-heading">${escapeHTML(node.name.trim() || 'UNNAMED NODE')}</span>
                </div>
                <span class="node-level-badge">${escapeHTML(level)}</span>
                ${removeButton}
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="name-${escapeHTML(node.id)}">Node name</label>
                  <input id="name-${escapeHTML(node.id)}" name="name" type="text" maxlength="24" autocomplete="off" value="${escapeHTML(node.name)}" placeholder="e.g. A" data-action="update-name" data-node-id="${escapeHTML(node.id)}">
                </div>
                <div class="field">
                  <label for="role-${escapeHTML(node.id)}">Role</label>
                  ${roleField}
                </div>
              </div>
              <div class="connections">
                <div class="connections-head">
                  <span class="mini-label">Outgoing connections</span>
                  <span class="mini-label">${String(node.edges.length).padStart(2, '0')}</span>
                </div>
                <div class="connection-list">${outgoing || '<span class="empty-edges">NO CONNECTIONS YET</span>'}</div>
              </div>
              <form class="edge-form" data-action="add-edge-form" data-node-id="${escapeHTML(node.id)}">
                <select name="to" aria-label="Destination node" required>${targetOptions}</select>
                <input name="weight" type="number" min="0" step="any" value="1" aria-label="Connection weight" required>
                <button type="submit" class="edge-add" aria-label="Add connection" title="Add connection">+</button>
              </form>
            </article>`;
        }).join('');

        const addDisabled = busyAction === 'add' || appState.nodes.length >= 40;
        const solveDisabled = busyAction === 'solve';
        nodeCards.innerHTML = cards + `
          <div class="editor-actions" aria-label="Graph actions">
            <button type="button" class="add-node-button" data-action="add-node" aria-label="Add node" title="Add node" ${addDisabled ? 'disabled' : ''}>+</button>
            <button type="button" class="solve-button" data-action="solve" ${solveDisabled ? 'disabled' : ''}>
              <span>${solveDisabled ? 'SOLVING…' : 'SOLVE'}</span><span class="solve-arrow" aria-hidden="true">↗</span>
            </button>
          </div>`;
      }

      function nodeBoxSize(node, maxWidth = 210) {
        const nameLength = (node.name || '').trim().length;
        const naturalWidth = Math.max(88, Math.min(210, nameLength * 9 + 48));
        return { width: Math.min(naturalWidth, maxWidth), height: 68 };
      }

      function renderGraph() {
        const visibleNodes = appState.nodes.filter(node => node.name.trim());
        const width = Math.max(graphCanvas.clientWidth, 320);
        const height = Math.max(graphCanvas.clientHeight, 300);
        const maxLevel = Math.max(2, Number(appState.max_level) || 2);
        const compact = width < 600;
        const leftPad = compact ? 62 : 110;
        const rightPad = leftPad;
        const availableGap = (width - leftPad - rightPad) / maxLevel;
        const canFitLevels = availableGap >= (compact ? 82 : 168);
        const levelGap = canFitLevels ? availableGap : 230;
        const virtualWidth = canFitLevels ? width : leftPad + maxLevel * levelGap + rightPad;
        const nodeMaxWidth = Math.max(70, Math.min(210, levelGap * (compact ? 0.72 : 0.78)));

        const levels = Array.from({ length: maxLevel + 1 }, () => []);
        visibleNodes.forEach(node => {
          let level;
          if (node.role === 'start') level = 0;
          else if (node.role === 'finish') level = maxLevel;
          else level = Math.min(maxLevel - 1, Math.max(1, Number(node.level) || 1));
          levels[level].push({ ...node, visualLevel: level });
        });

        const maxRows = Math.max(1, ...levels.map(levelNodes => levelNodes.length));
        const virtualHeight = Math.max(height, 180 + maxRows * 120);
        const topPad = 126;
        const bottomPad = 70;
        const verticalSpace = virtualHeight - topPad - bottomPad;
        graphSvg.style.width = `${virtualWidth}px`;
        graphSvg.style.height = `${virtualHeight}px`;
        graphSvg.setAttribute('viewBox', `0 0 ${virtualWidth} ${virtualHeight}`);

        const positions = new Map();
        levels.forEach((levelNodes, levelIndex) => {
          const x = leftPad + levelIndex * levelGap;
          levelNodes.forEach((node, rowIndex) => {
            const y = topPad + ((rowIndex + 1) * verticalSpace / (levelNodes.length + 1));
            positions.set(node.id, { x, y, box: nodeBoxSize(node, nodeMaxWidth), node });
          });
        });

        const solutionEdges = new Set();
        const solution = appState.solution;
        if (solution?.reachable && Array.isArray(solution.pathIds)) {
          for (let i = 0; i < solution.pathIds.length - 1; i++) {
            solutionEdges.add(`${solution.pathIds[i]}->${solution.pathIds[i + 1]}`);
          }
        }

        const levelGuides = [];
        for (let level = 0; level <= maxLevel; level++) {
          const x = leftPad + level * levelGap;
          const title = compact
            ? (level === 0 ? 'START · 0' : level === maxLevel ? 'END · LAST' : `LEVEL ${level}`)
            : (level === 0 ? 'START · LEVEL 0' : level === maxLevel ? 'DESTINATION · LAST LEVEL' : `BFS LEVEL ${level}`);
          levelGuides.push(`
            <line class="level-divider" x1="${x}" y1="88" x2="${x}" y2="${virtualHeight - 40}" />
            <text class="level-header" x="${x}" y="76">${title}</text>`);
        }

        const edges = [];
        visibleNodes.forEach(source => {
          const from = positions.get(source.id);
          source.edges.forEach(edge => {
            const destination = positions.get(edge.to);
            if (!from || !destination) return;
            const to = destination;
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const norm = Math.hypot(dx, dy) || 1;
            const nx = -dy / norm;
            const ny = dx / norm;
            const startFactor = 1 / Math.max(Math.abs(dx) / (from.box.width / 2), Math.abs(dy) / (from.box.height / 2), 0.0001);
            const endFactor = 1 / Math.max(Math.abs(dx) / (to.box.width / 2), Math.abs(dy) / (to.box.height / 2), 0.0001);
            const start = { x: from.x + dx * startFactor, y: from.y + dy * startFactor };
            const end = { x: to.x - dx * endFactor, y: to.y - dy * endFactor };
            const isReversePair = to.node.edges.some(item => item.to === source.id);
            const sameLevel = from.node.visualLevel === to.node.visualLevel;
            // Same-level links take a wide arc so they don't cut through other node boxes.
            const curve = sameLevel
              ? (source.id < to.node.id ? 260 : -260)
              : isReversePair ? (source.id < to.node.id ? 30 : -30) : 0;
            const control = { x: (start.x + end.x) / 2 + nx * curve, y: (start.y + end.y) / 2 + ny * curve };
            const label = { x: (start.x + 2 * control.x + end.x) / 4, y: (start.y + 2 * control.y + end.y) / 4 };
            const isSolution = solutionEdges.has(`${source.id}->${edge.to}`);
            edges.push(`
              <g class="graph-edge">
                <path class="edge-path${isSolution ? ' is-solution' : ''}" d="M ${start.x} ${start.y} Q ${control.x} ${control.y} ${end.x} ${end.y}" />
                <rect class="edge-label-bg" x="${label.x - 21}" y="${label.y - 13}" width="42" height="26" />
                <text class="edge-label" x="${label.x}" y="${label.y}">${escapeHTML(edge.weight)}</text>
              </g>`);
          });
        });

        const nodeMarkup = visibleNodes.map(node => {
          const position = positions.get(node.id);
          const { x, y, box } = position;
          const classes = ['graph-node', node.role || 'regular'];
          if (solution?.reachable && solution.pathIds?.includes(node.id)) classes.push('solution');
          if (selectedNodeId === node.id) classes.push('selected');
          const roleText = node.role === 'start' ? 'START' : node.role === 'finish' ? 'DESTINATION' : `LEVEL ${position.node.visualLevel}`;
          const maxNameChars = Math.max(3, Math.floor((box.width - 20) / (compact ? 7 : 8.5)));
          const displayName = node.name.trim().length > maxNameChars ? node.name.trim().slice(0, maxNameChars - 1) + '…' : node.name.trim();
          return `
            <g class="${classes.join(' ')}" transform="translate(${x}, ${y})" data-node-id="${escapeHTML(node.id)}" tabindex="0" role="button" aria-label="Select node ${escapeHTML(node.name)}${node.role ? ', fixed endpoint' : ', move between levels'}">
              <title>${escapeHTML(node.name)}${node.role ? ` — ${node.role === 'start' ? 'start, fixed left' : 'destination, fixed right'}` : ` — level ${position.node.visualLevel}`}</title>
              <rect class="graph-node-rect" x="${-box.width / 2}" y="${-box.height / 2}" width="${box.width}" height="${box.height}" rx="0" />
              <text class="graph-node-text" x="0" y="${node.role ? -5 : -3}">${escapeHTML(displayName)}</text>
              <text class="graph-node-role" x="0" y="18">${escapeHTML(roleText)}</text>
            </g>`;
        }).join('');

        graphSvg.innerHTML = `
          <defs>
            <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L0,7 L7,3.5 z" fill="#92928b"></path>
            </marker>
            <marker id="arrow-solution" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L0,7 L7,3.5 z" fill="#e3342b"></path>
            </marker>
          </defs>
          ${levelGuides.join('')}
          ${edges.join('')}
          ${nodeMarkup}
          ${visibleNodes.length ? '' : `<text x="${virtualWidth / 2}" y="${virtualHeight / 2}" text-anchor="middle" fill="#77776f" font-family="ui-monospace,monospace" font-size="13">ADD A NAMED NODE TO BEGIN</text>`}
        `;
        graphSvg.setAttribute('aria-label', `Preview graph with ${visibleNodes.length} named nodes, ${edges.length} connections, start on the left and destination on the right`);
      }

      function renderLevelMovePanel() {
        const node = getNode(selectedNodeId);
        if (!node || ['start', 'finish'].includes(node.role)) {
          levelMovePanel.hidden = true;
          return;
        }
        levelMovePanel.hidden = false;
        selectedNodeName.textContent = node.name.trim() || 'UNNAMED NODE';
        selectedNodeLevel.textContent = `BFS LEVEL ${node.level ?? 1}`;
        moveLeftButton.disabled = busyAction === 'move' || Number(node.level) <= 1;
        moveRightButton.disabled = busyAction === 'move';
      }

      function renderSolution() {
        const solution = appState.solution;
        solutionCard.hidden = !solution;
        if (!solution) return;
        if (solution.reachable) {
          solutionValue.textContent = `Total cost: ${solution.cost}`;
          solutionPath.innerHTML = `<strong>SHORTEST PATH</strong><br>${solution.pathNames.map(escapeHTML).join(' → ')}`;
        } else {
          solutionValue.textContent = 'No route found';
          solutionPath.textContent = solution.message || 'No path connects the selected start and destination.';
        }
      }

      function renderAll() {
        renderCards();
        renderGraph();
        renderLevelMovePanel();
        renderSolution();
      }

      nodeCards.addEventListener('change', async event => {
        const target = event.target;
        const action = target.dataset.action;
        const nodeId = target.dataset.nodeId;
        if (!action || !nodeId) return;
        if (action === 'update-name') {
          await api(`/api/nodes/${encodeURIComponent(nodeId)}`, {
            method: 'PATCH', body: JSON.stringify({ name: target.value })
          });
        } else if (action === 'update-role') {
          await api(`/api/nodes/${encodeURIComponent(nodeId)}`, {
            method: 'PATCH', body: JSON.stringify({ role: target.value })
          });
        }
      });

      nodeCards.addEventListener('submit', async event => {
        const form = event.target.closest('form[data-action="add-edge-form"]');
        if (!form) return;
        event.preventDefault();
        const nodeId = form.dataset.nodeId;
        const destination = form.elements.to.value;
        const weightText = form.elements.weight.value;
        if (weightText === '' || !Number.isFinite(Number(weightText)) || Number(weightText) < 0) {
          showToast('Enter a finite weight greater than or equal to zero.');
          return;
        }
        await api(`/api/nodes/${encodeURIComponent(nodeId)}/edges`, {
          method: 'POST', body: JSON.stringify({ to: destination, weight: Number(weightText) })
        });
      });

      nodeCards.addEventListener('click', async event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const { action, nodeId, targetId } = button.dataset;

        if (action === 'delete-node') {
          if (!window.confirm(`Delete node “${nodeName(nodeId)}” and all its connections?`)) return;
          await api(`/api/nodes/${encodeURIComponent(nodeId)}`, { method: 'DELETE' });
          return;
        }
        if (action === 'remove-edge') {
          await api(`/api/nodes/${encodeURIComponent(nodeId)}/edges/${encodeURIComponent(targetId)}`, { method: 'DELETE' });
          return;
        }
        if (action === 'add-node' && !busyAction) {
          busyAction = 'add';
          renderCards();
          const previousCount = appState.nodes.length;
          const payload = await api('/api/nodes', { method: 'POST', body: '{}' });
          busyAction = '';
          renderCards();
          if (payload) {
            const newest = appState.nodes[appState.nodes.length - 1];
            nodeCards.scrollTo({ left: nodeCards.scrollWidth, behavior: 'smooth' });
            window.setTimeout(() => document.getElementById(`name-${newest.id}`)?.focus(), 160);
            if (appState.nodes.length > previousCount) showToast(`Node ${newest.name} added.`, false);
          }
          return;
        }
        if (action === 'solve' && !busyAction) {
          busyAction = 'solve';
          renderCards();
          const payload = await api('/api/solve', { method: 'POST', body: '{}' });
          busyAction = '';
          renderCards();
          renderSolution();
          if (payload?.state?.solution?.reachable) showToast('Shortest path calculated.', false);
          else if (payload?.state?.solution && !payload.state.solution.reachable) showToast(payload.state.solution.message, true);
        }
      });

      function selectGraphNode(target) {
        const node = getNode(target?.dataset?.nodeId);
        if (!node) return;
        if (node.role === 'start') {
          selectedNodeId = null;
          renderGraph();
          renderLevelMovePanel();
          showToast('The start node is locked to level 0 on the far left.', false);
          return;
        }
        if (node.role === 'finish') {
          selectedNodeId = null;
          renderGraph();
          renderLevelMovePanel();
          showToast('The destination is locked to the last level on the far right.', false);
          return;
        }
        selectedNodeId = node.id;
        renderGraph();
        renderLevelMovePanel();
      }

      graphSvg.addEventListener('click', event => {
        const node = event.target.closest('.graph-node[data-node-id]');
        if (node) selectGraphNode(node);
      });
      graphSvg.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const node = event.target.closest('.graph-node[data-node-id]');
        if (!node) return;
        event.preventDefault();
        selectGraphNode(node);
      });

      async function moveSelectedNode(direction) {
        if (!selectedNodeId || busyAction === 'move') return;
        const nodeId = selectedNodeId;
        busyAction = 'move';
        renderLevelMovePanel();
        await api(`/api/nodes/${encodeURIComponent(nodeId)}/level`, {
          method: 'POST', body: JSON.stringify({ direction })
        });
        busyAction = '';
        renderGraph();
        renderLevelMovePanel();
      }
      moveLeftButton.addEventListener('click', () => moveSelectedNode('left'));
      moveRightButton.addEventListener('click', () => moveSelectedNode('right'));

      if ('ResizeObserver' in window) {
        new ResizeObserver(() => renderGraph()).observe(graphCanvas);
      } else {
        window.addEventListener('resize', renderGraph);
      }
      loadState();
    })();
  </script>
</body>
</html>
